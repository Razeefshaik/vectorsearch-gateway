syntax = "proto3";

package vectorsearch.gateway.v1;

option go_package = "github.com/Razeefshaik/vectorsearch-gateway/go/proto/gatewaypb;gatewaypb";

// Deliberately self-contained: the gateway is the only service external
// clients ever talk to, and its wire contract should not require callers to
// also know coordinator.proto. gatewayd's Server converts between these
// types and the coordinator's internally (see go/gateway/server.go); the
// coordinator itself, and how many shards it runs, is not part of this API.

service Gateway {
    rpc Insert(GatewayInsertRequest) returns (GatewayInsertResponse);
    rpc Search(GatewaySearchRequest) returns (GatewaySearchResponse);
    rpc Delete(GatewayDeleteRequest) returns (GatewayDeleteResponse);
}

message GatewayKey {
  uint64 client_id = 1;
  uint64 label     = 2;
}

message GatewayScoredResult {
  GatewayKey key      = 1;
  float      distance = 2;
}

message GatewaySearchRequest {
  string text = 1;
  uint32 k = 2;
  uint32 ef = 3;
  bool allow_partial = 4;
  uint64 client_id = 5;
}

message GatewaySearchResponse {
  repeated GatewayScoredResult results = 1;

  // Passed through from the coordinator's own SearchResponse so degradation
  // is never silent here either.
  uint32 shards_queried = 2;
  uint32 shards_failed  = 3;
}

message GatewayInsertRequest {
  GatewayKey key = 1;
  string text = 2;
}

message GatewayInsertResponse {}

message GatewayDeleteRequest  { GatewayKey key = 1; }
message GatewayDeleteResponse {}
