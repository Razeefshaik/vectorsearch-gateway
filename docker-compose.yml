name: vectorsearch-gateway

# Coordinator/shard defaults, reused by shard0-3 below via the YAML anchor.
# Mirrors ../VectorSearchEngine/docker-compose.yml's own x-shard block --
# see the comment above the `coordinator:` service for why this is a second
# copy rather than an `include:` of that file.
x-shard: &shard-defaults
  build: "${VSE_PATH}"
  restart: unless-stopped
  networks: [vsgw]
  healthcheck:
    test: ["CMD", "nc", "-z", "localhost", "7001"]
    interval: 2s
    timeout: 2s
    retries: 15
    start_period: 10s
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 1g }

networks:
  vsgw:
    name: vsgw
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  bugbrother-shard0-data:
  bugbrother-shard1-data:
  bugbrother-shard2-data:
  bugbrother-shard3-data:

services:
  # ---------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    networks: [vsgw]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  embed-search:
    build: ./python/embed_service
    restart: unless-stopped
    networks: [vsgw]
    ports:
      - "${EMBED_SEARCH_PORT}:${EMBED_SEARCH_PORT}"
      - "${EMBED_SEARCH_METRICS_PORT}:9100"
    environment:
      METRICS_PORT: "9100"
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION}

    command: ["${EMBED_SEARCH_PORT}"]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3g }

  embed-ingest:
    build: ./python/embed_service
    restart: unless-stopped
    networks: [vsgw]
    ports:
      - "${EMBED_INGEST_PORT}:${EMBED_INGEST_PORT}"
      - "${EMBED_INGEST_METRICS_PORT}:9100"
    environment:
      METRICS_PORT: "9100"
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION}
    command: ["${EMBED_INGEST_PORT}"]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3g }

  gatewayd:
    build:
      context: ./go
      dockerfile: Dockerfile.gatewayd
    restart: unless-stopped
    networks: [vsgw]
    ports:
      - "${GATEWAYD_PORT}:${GATEWAYD_PORT}"
      - "${GATEWAYD_METRICS_PORT}:${GATEWAYD_METRICS_PORT}"
    environment:
      GATEWAYD_PORT: "${GATEWAYD_PORT}"
      GATEWAYD_METRICS_PORT: "${GATEWAYD_METRICS_PORT}"
      KAFKA_BROKER: "kafka:9092"
      INGEST_TOPIC: "${INGEST_TOPIC}"
      # Container DNS names, not the localhost:<port> fallback used for
      # local/hybrid dev -- see go/internal/config.AddrOrLocalPort.
      EMBED_SEARCH_ADDR: "embed-search:${EMBED_SEARCH_PORT}"
      EMBED_INGEST_ADDR: "embed-ingest:${EMBED_INGEST_PORT}"
      COORDINATOR_ADDR: "coordinator:8000"
    depends_on:
      kafka: { condition: service_healthy }
      embed-search: { condition: service_healthy }
      embed-ingest: { condition: service_healthy }
      coordinator: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  consumer:
    build:
      context: ./go
      dockerfile: Dockerfile.consumer
    restart: unless-stopped
    networks: [vsgw]
    ports:
      - "${CONSUMER_METRICS_PORT}:${CONSUMER_METRICS_PORT}"
    environment:
      CONSUMER_METRICS_PORT: "${CONSUMER_METRICS_PORT}"
      KAFKA_BROKER: "kafka:9092"
      INGEST_TOPIC: "${INGEST_TOPIC}"
      CONSUMER_GROUP: "${CONSUMER_GROUP}"
      EMBED_INGEST_ADDR: "embed-ingest:${EMBED_INGEST_PORT}"
      COORDINATOR_ADDR: "coordinator:8000"
    depends_on:
      kafka: { condition: service_healthy }
      embed-ingest: { condition: service_healthy }
      coordinator: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  # ---------------------------------------------------------------------
  # Coordinator + shard cluster -- the real vector-search engine, built from
  # the sibling VectorSearchEngine repo (see .env's VSE_PATH). Topology and
  # command args mirror that repo's own docker-compose.yml exactly (4
  # shards, dim=128 -- see that file's comments for why); this is a second,
  # explicit copy of those service definitions rather than a Compose
  # `include:` of that file, so this network's service names
  # (embed-search, kafka, ...) and VSE's are guaranteed to resolve on the
  # same `vsgw` network without relying on include's cross-project network
  # merging behaving as hoped. Metrics come from go/observability in that
  # repo -- see its DOCUMENTATION.md and this repo's docs/MONITORING.md.
  # ---------------------------------------------------------------------
  shard0:
    <<: *shard-defaults
    command: ["shardd", "-listen", ":7001", "-metrics-listen", ":${SHARD_METRICS_PORT}", "-data", "/data", "-dim",  "${EMBEDDING_DIMENSION}", "-max-elements", "500000", "-snapshot-interval", "2m"]
    volumes: ["bugbrother-shard0-data:/data"]

  shard1:
    <<: *shard-defaults
    command: ["shardd", "-listen", ":7001", "-metrics-listen", ":${SHARD_METRICS_PORT}", "-data", "/data", "-dim",  "${EMBEDDING_DIMENSION}", "-max-elements", "500000", "-snapshot-interval", "2m"]
    volumes: ["bugbrother-shard1-data:/data"]

  shard2:
    <<: *shard-defaults
    command: ["shardd", "-listen", ":7001", "-metrics-listen", ":${SHARD_METRICS_PORT}", "-data", "/data", "-dim",  "${EMBEDDING_DIMENSION}", "-max-elements", "500000", "-snapshot-interval", "2m"]
    volumes: ["bugbrother-shard2-data:/data"]

  shard3:
    <<: *shard-defaults
    command: ["shardd", "-listen", ":7001", "-metrics-listen", ":${SHARD_METRICS_PORT}", "-data", "/data", "-dim",  "${EMBEDDING_DIMENSION}", "-max-elements", "500000", "-snapshot-interval", "2m"]
    volumes: ["bugbrother-shard3-data:/data"]

  coordinator:
    build: "${VSE_PATH}"
    restart: unless-stopped
    networks: [vsgw]
    command: ["coordinatord", "-listen", ":8000", "-metrics-listen", ":${COORDINATOR_METRICS_PORT}", "-shards", "shard0:7001,shard1:7001,shard2:7001,shard3:7001"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8000"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s
    ports:
      - "8000:8000"
      - "${COORDINATOR_METRICS_PORT}:${COORDINATOR_METRICS_PORT}"
    depends_on:
      shard0: { condition: service_healthy }
      shard1: { condition: service_healthy }
      shard2: { condition: service_healthy }
      shard3: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  # ---------------------------------------------------------------------
  # Monitoring stack -- one combined Prometheus/Grafana/Alertmanager
  # instance for the whole system. See docs/MONITORING.md.
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    networks: [vsgw]
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    networks: [vsgw]
    ports:
      - "${ALERTMANAGER_PORT}:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 128m }

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    restart: unless-stopped
    networks: [vsgw]
    ports:
      - "${KAFKA_EXPORTER_PORT}:9308"
    command:
      - "--kafka.server=kafka:9092"
    depends_on:
      kafka: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 128m }

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    networks: [vsgw]
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
